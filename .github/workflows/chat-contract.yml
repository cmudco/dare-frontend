name: Chat contract
on:
  pull_request:
    paths:
      - 'src/**'
      - 'packages/chat-socket-contract/**'
      - 'vendor/**'
      - 'tests/**'
      - 'scripts/*chat-contract*'
      - 'package*.json'
      - '.github/workflows/chat-contract.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run test:chat-contract
      - run: npm run app:build
