name: Deploy Dare Frontend to Staging

on:
  push:
    branches:
      - dev

jobs:
  deploy-staging:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to Staging via SSH
        env:
          SSH_PASSWORD: ${{ secrets.STAGING_SSH_PASSWORD }}
          SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << 'EOF'
            set -e
            echo "Connected to the staging server"

            echo "Using Node.js 22 for the frontend/docs build..."
            NODE_VERSION="22.16.0"
            NODE_DIR="$HOME/.local/node-v${NODE_VERSION}-linux-x64"
            if [ ! -x "$NODE_DIR/bin/node" ]; then
              mkdir -p "$HOME/.local"
              curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o /tmp/node-v${NODE_VERSION}-linux-x64.tar.xz
              tar -xJf /tmp/node-v${NODE_VERSION}-linux-x64.tar.xz -C "$HOME/.local"
            fi
            export PATH="$NODE_DIR/bin:$PATH"
            node -v
            npm -v

            echo "Running deploy_fe.sh..."
            cd /home/deployer/dare
            ./deploy_fe.sh

            echo "Staging deployment finished."
          EOF

      - name: Handle deployment failure
        if: ${{ failure() }}
        run: echo "Staging deployment failed. Please check the logs for more information."
