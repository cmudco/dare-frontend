<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DARE — AI infrastructure built for education</title>
    <meta
      name="description"
      content="DARE is an open-source LLM gateway platform built by educators at Carnegie Mellon University. Self-hosted, governed, and pedagogically grounded AI infrastructure for higher education."
    />

    <!-- Brand typefaces: Fraunces (display/serif), Outfit (sans), JetBrains Mono (mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Apply persisted theme before first paint to avoid a flash; must run
         after <body> exists since the theme attributes live on body. -->
    <script>
      ;(function () {
        try {
          var theme = localStorage.getItem('dare-theme-name') || 'default'
          var mode =
            localStorage.getItem('dare-theme-mode') ||
            localStorage.getItem('dare-theme') ||
            'light'
          if (mode === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          document.body.setAttribute('data-theme', theme)
          if (mode === 'dark') document.body.classList.add('dark')
        } catch (e) {
          /* default theme stays applied */
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
