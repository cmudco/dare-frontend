    // Create icon component factory
    const createIcon = (paths) => {
      return React.forwardRef(({ className, size = 24, strokeWidth = 2, ...props }, ref) => {
        const pathElements = paths.split('|').map((d, i) => {
          if (d.includes('m-')) {
            // Circle shorthand: cx cy m-r -> circle
            const match = d.match(/M?(\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)m-(\d+(?:\.\d+)?)/i);
            if (match) {
              return React.createElement('circle', { key: i, cx: match[1], cy: match[2], r: match[3] });
            }
          }
          return React.createElement('path', { key: i, d: d.trim() });
        });

        return React.createElement('svg', {
          ref,
          xmlns: "http://www.w3.org/2000/svg",
          width: size,
          height: size,
          viewBox: "0 0 24 24",
          fill: "none",
          stroke: "currentColor",
          strokeWidth: strokeWidth,
          strokeLinecap: "round",
          strokeLinejoin: "round",
          className: cn("shrink-0", className),
          ...props
        }, ...pathElements);
      });
    };

    // Create all icon components
    const Icons = {};
    Object.entries(iconPaths).forEach(([name, paths]) => {
      Icons[name] = createIcon(paths);
    });

    // Also expose icons directly as globals for convenience
    Object.entries(Icons).forEach(([name, component]) => {
      window[name] = component;
    });

    // ========== ERROR BOUNDARY ==========
    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { hasError: false, error: null }; }
      static getDerivedStateFromError(error) { return { hasError: true, error }; }
      componentDidCatch(error) { parent.postMessage({ type: 'error', message: error.message, stack: error.stack }, '*'); }
      render() {
        if (this.state.hasError) {
          return React.createElement('div', { className: 'error-display' }, 'Runtime Error: ' + this.state.error?.message);
        }
        return this.props.children;
      }
    }

    // ========== GLOBALS ==========
    const { useState, useEffect, useRef, useMemo, useCallback, useReducer, useContext, createContext, Fragment } = React;

    // ========== MESSAGE HANDLER ==========
    window.addEventListener('message', async (event) => {
      if (event.data.type === 'render') {
        const root = document.getElementById('root');

        try {
          let code = event.data.code;

          // Preprocess: Convert ES module exports to something we can handle
          // This handles: export default function App() {...}
          //               export default function() {...}
          //               export default () => {...}
          //               export default App
          code = code
            // export default function App() -> function App()
            .replace(/export\s+default\s+function\s+(\w+)/g, 'function $1')
            // export default function() -> const App = function()
            .replace(/export\s+default\s+function\s*\(/g, 'const App = function(')
            // export default () => -> const App = () =>
            .replace(/export\s+default\s+\(\s*\)\s*=>/g, 'const App = () =>')
            // export default (props) => -> const App = (props) =>
            .replace(/export\s+default\s+\(([^)]*)\)\s*=>/g, 'const App = ($1) =>')
            // export default SomeComponent -> const _exportDefault = SomeComponent (we'll handle this)
            .replace(/export\s+default\s+(\w+)\s*;?\s*$/gm, 'const _exportDefault = $1;');

          const transformed = Babel.transform(code, {
            presets: ['react'],
            filename: 'component.jsx'
          }).code;

          // Build parameter names and values dynamically
          const iconNames = Object.keys(Icons);
          const paramNames = [
            'React', 'useState', 'useEffect', 'useRef', 'useMemo', 'useCallback', 'useReducer', 'useContext', 'createContext', 'Fragment',
            'Button', 'Card', 'CardHeader', 'CardTitle', 'CardDescription', 'CardContent', 'CardFooter',
            'Input', 'Textarea', 'Label', 'Badge', 'Alert', 'AlertTitle', 'AlertDescription',
            'Switch', 'Checkbox', 'Separator', 'Progress', 'Slider',
            'Avatar', 'AvatarImage', 'AvatarFallback', 'ScrollArea',
            'cn', '_', 'Icons',
            ...iconNames
          ];

          const paramValues = [
            React, useState, useEffect, useRef, useMemo, useCallback, useReducer, useContext, createContext, Fragment,
            Button, Card, CardHeader, CardTitle, CardDescription, CardContent, CardFooter,
            Input, Textarea, Label, Badge, Alert, AlertTitle, AlertDescription,
            Switch, Checkbox, Separator, Progress, Slider,
            Avatar, AvatarImage, AvatarFallback, ScrollArea,
            cn, _, Icons,
            ...Object.values(Icons)
          ];

          const createComponent = new Function(
            ...paramNames,
            `
              ${transformed}
              // Try to find the component in order of preference
              if (typeof App !== 'undefined') return App;
              if (typeof _exportDefault !== 'undefined') return _exportDefault;
              // Look for any PascalCase function (likely a component)
              const componentNames = Object.keys(this).filter(k => typeof this[k] === 'function' && /^[A-Z]/.test(k));
              if (componentNames.length > 0) return this[componentNames[0]];
              throw new Error('No React component found. Export a default component or define an App function.');
            `
          );

          const Component = createComponent(...paramValues);

          ReactDOM.createRoot(root).render(
            React.createElement(ErrorBoundary, null, React.createElement(Component))
          );

          parent.postMessage({ type: 'success' }, '*');

        } catch (error) {
          root.innerHTML = `<div class="error-display"><strong>Error:</strong> ${error.message}</div>`;
          parent.postMessage({ type: 'error', message: error.message, stack: error.stack }, '*');
        }
      }
    });

    parent.postMessage({ type: 'ready' }, '*');
